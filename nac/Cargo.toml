[package]
name = "open-absinthe"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"
exclude = [".build/**", "target/**"]

[lib]
name = "open_absinthe"

[features]
default = []
serde = []

[dependencies]
serde = { version = "1", features = ["derive"] }
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rand = "0.8"

[dev-dependencies]
plist = "1"

